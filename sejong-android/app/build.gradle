plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.dca.sejong'
    compileSdk 36

    defaultConfig {
        applicationId "com.dca.sejong"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        dataBinding true
    }

    buildTypes {
        debug {
            minifyEnabled true // 난독화

            proguardFile getDefaultProguardFile('proguard-android.txt')
            proguardFile 'proguard-rules.pro'
            proguardFile 'proguard-debug.pro'
            //proguardFile 'proguard-fresco.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true   //미사용 리소스 제거
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
  }
    flavorDimensions "flavors"
    productFlavors {
        devel {
            //dimension "flavors"
            versionCode 1
            versionName "V1.0"
            buildConfigField "boolean", "IS_DEVEL", "true"
            resValue("string", "app_name", "[개발] allCare")

        }

        oper {
            //dimension "flavors"

            versionCode 3
            versionName "V1.0"
            buildConfigField "boolean", "IS_DEVEL", "false"
            resValue("string", "app_name", "allCare")
        }
    }
    applicationVariants.all { variant ->
        def projectName = "Sejong Health"
        def flavor = variant.productFlavors[0].name
        def buildType = variant.buildType.name
        def versionName = variant.versionName
        def date = new Date()
        def formatteDate = date.format('yyMMdd')

        def apkName = projectName + "-" + versionName + "-" + formatteDate + "-" + flavor + "-" + buildType + ".apk"
        variant.outputs.all { output ->
            outputFileName = new File(apkName)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    /*implementation libs.appcompat*/
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    //implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    //testImplementation 'junit:junit:4.12'
    //androidTestImplementation 'com.android.support.test:runner:1.0.2'
    //androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation 'com.ssomai:android.scalablelayout:2.1.6'
    //implementation 'com.android.support:appcompat-v7:28.0.0'
    //FoodLens SDK
    //implementation "com.doinglab.foodlens:FoodLens:2.6.4"
    implementation ('com.doinglab.foodlens:FoodLens:2.6.71') {
        exclude group: 'com.android.support', module: 'appcompat'
        exclude group: 'com.android.support', module: 'design'
        exclude group: 'com.android.support', module: 'support-v4'
        exclude group: 'com.android.support.constraint', module: 'constraint-layout'
    }
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.health.connect:connect-client:1.1.0-rc02'
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.0.21"
}